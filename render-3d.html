<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Códigos de Barras - Render 3D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            max-width: 300px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        #info h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }
        #info p {
            margin: 5px 0;
            font-size: 13px;
            line-height: 1.5;
        }
        #info .specs {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 25px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .highlight {
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>🔲 Terminal Portátil de Códigos de Barras</h2>
        <p><strong>Prototipo v1.0</strong></p>
        <div class="specs">
            <p>📏 <span class="highlight">85 x 165 x 30 mm</span></p>
            <p>⚖️ <span class="highlight">~175g</span></p>
            <p>🔋 Batería: 3000mAh LiPo</p>
            <p>📱 Conectividad: BLE 5.0</p>
            <p>📊 Scanner: GM67 2D/1D</p>
            <p>🖥️ Display: OLED 1.3"</p>
        </div>
    </div>

    <div id="controls">
        🖱️ Arrastra para rotar • 🔍 Scroll para zoom
    </div>

    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuración de la escena
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // Cámara
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(200, 150, 200);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controles
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 150;
        controls.maxDistance = 400;

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight1.position.set(100, 100, 50);
        directionalLight1.castShadow = true;
        directionalLight1.shadow.mapSize.width = 2048;
        directionalLight1.shadow.mapSize.height = 2048;
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0x4a90e2, 0.4);
        directionalLight2.position.set(-50, 50, -50);
        scene.add(directionalLight2);

        const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
        rimLight.position.set(0, 50, -100);
        scene.add(rimLight);

        // Grupo principal del terminal
        const terminal = new THREE.Group();

        // Dimensiones en mm (convertidas a unidades Three.js, escala 1:1)
        const width = 85;
        const height = 165;
        const depth = 30;
        const cornerRadius = 8;

        // Materiales
        const bodyMaterial = new THREE.MeshStandardMaterial({
            color: 0x2c3e50,
            roughness: 0.4,
            metalness: 0.3
        });

        const frontMaterial = new THREE.MeshStandardMaterial({
            color: 0x34495e,
            roughness: 0.3,
            metalness: 0.2
        });

        const screenMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a3a52,
            roughness: 0.1,
            metalness: 0.7,
            emissive: 0x0a4d6e,
            emissiveIntensity: 0.3
        });

        const buttonMaterial = new THREE.MeshStandardMaterial({
            color: 0x95a5a6,
            roughness: 0.5,
            metalness: 0.4
        });

        const scannerMaterial = new THREE.MeshStandardMaterial({
            color: 0x1c1c1c,
            roughness: 0.2,
            metalness: 0.8,
            emissive: 0x330000,
            emissiveIntensity: 0.2
        });

        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x88ccff,
            metalness: 0.1,
            roughness: 0,
            transmission: 0.9,
            thickness: 0.5,
            envMapIntensity: 1
        });

        const ledMaterial = new THREE.MeshStandardMaterial({
            color: 0x00ff00,
            emissive: 0x00ff00,
            emissiveIntensity: 0.8
        });

        // Función para crear cuerpo redondeado
        function createRoundedBox(w, h, d, r) {
            const shape = new THREE.Shape();
            const x = -w/2, y = -h/2;

            shape.moveTo(x + r, y);
            shape.lineTo(x + w - r, y);
            shape.quadraticCurveTo(x + w, y, x + w, y + r);
            shape.lineTo(x + w, y + h - r);
            shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            shape.lineTo(x + r, y + h);
            shape.quadraticCurveTo(x, y + h, x, y + h - r);
            shape.lineTo(x, y + r);
            shape.quadraticCurveTo(x, y, x + r, y);

            const extrudeSettings = {
                depth: d,
                bevelEnabled: true,
                bevelThickness: 2,
                bevelSize: 1,
                bevelSegments: 3
            };

            return new THREE.ExtrudeGeometry(shape, extrudeSettings);
        }

        // Cuerpo principal
        const bodyGeometry = createRoundedBox(width, height, depth, cornerRadius);
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.castShadow = true;
        body.receiveShadow = true;
        body.position.z = -depth/2;
        terminal.add(body);

        // Panel frontal (ligeramente elevado)
        const frontPanelGeometry = createRoundedBox(width - 4, height - 4, 2, cornerRadius - 1);
        const frontPanel = new THREE.Mesh(frontPanelGeometry, frontMaterial);
        frontPanel.position.z = 1;
        terminal.add(frontPanel);

        // Pantalla OLED (1.3" = ~33mm x 16mm visible)
        const screenGroup = new THREE.Group();
        const screenBorderGeometry = new THREE.BoxGeometry(40, 22, 3);
        const screenBorder = new THREE.Mesh(screenBorderGeometry, new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
        screenBorder.position.set(0, height/2 - 35, 2);

        const screenDisplayGeometry = new THREE.BoxGeometry(36, 18, 1);
        const screenDisplay = new THREE.Mesh(screenDisplayGeometry, screenMaterial);
        screenDisplay.position.set(0, height/2 - 35, 3.5);

        terminal.add(screenBorder);
        terminal.add(screenDisplay);

        // Scanner GM67 (área de escaneo en la parte superior)
        const scannerHousingGeometry = new THREE.BoxGeometry(60, 35, 8);
        const scannerHousing = new THREE.Mesh(scannerHousingGeometry, scannerMaterial);
        scannerHousing.position.set(0, height/2 - 80, 3);
        scannerHousing.castShadow = true;
        terminal.add(scannerHousing);

        // Ventana de vidrio del scanner
        const scannerGlassGeometry = new THREE.BoxGeometry(50, 25, 2);
        const scannerGlass = new THREE.Mesh(scannerGlassGeometry, glassMaterial);
        scannerGlass.position.set(0, height/2 - 80, 7);
        terminal.add(scannerGlass);

        // LED indicador del scanner
        const scannerLedGeometry = new THREE.SphereGeometry(1.5, 16, 16);
        const scannerLed = new THREE.Mesh(scannerLedGeometry, ledMaterial);
        scannerLed.position.set(22, height/2 - 68, 7);
        terminal.add(scannerLed);

        // Botones (4 botones táctiles)
        const buttonGeometry = new THREE.CylinderGeometry(5, 5, 2, 32);
        const buttonLabels = ['SCAN', 'OK', 'CANCEL', 'MENU'];
        const buttonY = -height/2 + 30;

        for (let i = 0; i < 4; i++) {
            const button = new THREE.Mesh(buttonGeometry, buttonMaterial);
            button.position.set(-30 + i * 20, buttonY, 3);
            button.rotation.x = Math.PI / 2;
            button.castShadow = true;
            terminal.add(button);

            // Símbolo del botón
            const symbolGeometry = new THREE.CircleGeometry(3, 32);
            const symbolMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c3e50,
                side: THREE.DoubleSide
            });
            const symbol = new THREE.Mesh(symbolGeometry, symbolMaterial);
            symbol.position.set(-30 + i * 20, buttonY, 4.5);
            terminal.add(symbol);
        }

        // Puerto USB-C
        const usbGeometry = new THREE.BoxGeometry(10, 3.5, 8);
        const usbMaterial = new THREE.MeshStandardMaterial({
            color: 0x606060,
            roughness: 0.3,
            metalness: 0.7
        });
        const usb = new THREE.Mesh(usbGeometry, usbMaterial);
        usb.position.set(0, -height/2 + 5, -depth/2 - 4);
        usb.rotation.x = Math.PI / 2;
        terminal.add(usb);

        // Interruptor ON/OFF
        const switchGeometry = new THREE.BoxGeometry(6, 12, 3);
        const switchMaterial = new THREE.MeshStandardMaterial({
            color: 0x8B0000,
            roughness: 0.4,
            metalness: 0.3
        });
        const powerSwitch = new THREE.Mesh(switchGeometry, switchMaterial);
        powerSwitch.position.set(width/2 - 6, height/2 - 20, -depth/2 - 1);
        terminal.add(powerSwitch);

        // LEDs indicadores (superior)
        const ledPositions = [
            { x: -15, y: height/2 - 15, color: 0xff0000 },  // Batería
            { x: -5, y: height/2 - 15, color: 0x00ff00 },   // Power
            { x: 5, y: height/2 - 15, color: 0x0000ff }     // BLE
        ];

        ledPositions.forEach(pos => {
            const led = new THREE.Mesh(
                new THREE.SphereGeometry(1.2, 16, 16),
                new THREE.MeshStandardMaterial({
                    color: pos.color,
                    emissive: pos.color,
                    emissiveIntensity: 0.6
                })
            );
            led.position.set(pos.x, pos.y, 3);
            terminal.add(led);
        });

        // Detalles adicionales: rejilla de altavoz/buzzer
        const speakerGeometry = new THREE.CircleGeometry(8, 32);
        const speakerMaterial = new THREE.MeshStandardMaterial({
            color: 0x1a1a1a,
            roughness: 0.8
        });
        const speaker = new THREE.Mesh(speakerGeometry, speakerMaterial);
        speaker.position.set(25, -height/2 + 50, 2);
        terminal.add(speaker);

        // Añadir pequeños agujeros en el altavoz
        for (let i = 0; i < 6; i++) {
            for (let j = 0; j < 6; j++) {
                const holeGeometry = new THREE.CircleGeometry(0.5, 8);
                const hole = new THREE.Mesh(holeGeometry, new THREE.MeshStandardMaterial({ color: 0x000000 }));
                hole.position.set(
                    25 + (i - 2.5) * 2,
                    -height/2 + 50 + (j - 2.5) * 2,
                    2.5
                );
                terminal.add(hole);
            }
        }

        // Logo/texto en el panel frontal
        const logoGeometry = new THREE.BoxGeometry(30, 8, 0.5);
        const logoMaterial = new THREE.MeshStandardMaterial({
            color: 0x4a90e2,
            emissive: 0x2c5aa0,
            emissiveIntensity: 0.3
        });
        const logo = new THREE.Mesh(logoGeometry, logoMaterial);
        logo.position.set(0, -height/2 + 15, 3);
        terminal.add(logo);

        // Agregar el terminal a la escena
        scene.add(terminal);

        // Plataforma de exhibición
        const platformGeometry = new THREE.CylinderGeometry(120, 130, 10, 64);
        const platformMaterial = new THREE.MeshStandardMaterial({
            color: 0x16213e,
            roughness: 0.3,
            metalness: 0.5
        });
        const platform = new THREE.Mesh(platformGeometry, platformMaterial);
        platform.position.y = -height/2 - 10;
        platform.receiveShadow = true;
        scene.add(platform);

        // Anillos decorativos en la plataforma
        const ringGeometry = new THREE.RingGeometry(125, 127, 64);
        const ringMaterial = new THREE.MeshStandardMaterial({
            color: 0x4a90e2,
            side: THREE.DoubleSide,
            emissive: 0x2c5aa0,
            emissiveIntensity: 0.4
        });
        const ring = new THREE.Mesh(ringGeometry, ringMaterial);
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = -height/2 - 4.5;
        scene.add(ring);

        // Partículas de fondo
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 200;
        const posArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 500;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 2,
            color: 0x4a90e2,
            transparent: true,
            opacity: 0.6
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // Animación
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);

            time += 0.01;

            // Rotación suave del terminal
            terminal.rotation.y = Math.sin(time * 0.3) * 0.1;

            // Animación de LEDs (parpadeando)
            scannerLed.material.emissiveIntensity = 0.8 + Math.sin(time * 3) * 0.2;

            // Rotación de partículas
            particlesMesh.rotation.y = time * 0.05;

            controls.update();
            renderer.render(scene, camera);
        }

        // Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
